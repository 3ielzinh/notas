name: CI/CD Pipeline

on:
  push:
    branches: [ master, desenvolvimento ]
  pull_request:
    branches: [ master, desenvolvimento ]

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-django

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,__pycache__,venv,env
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=migrations,__pycache__,venv,env

    - name: Run Django Tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: 'True'
      run: |
        python manage.py migrate
        python manage.py test

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: notas:${{ github.sha }}
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check image size
      run: |
        IMAGE_SIZE=$(docker images notas:${{ github.sha }} --format "{{.Size}}")
        echo "Image size: $IMAGE_SIZE"
        docker images notas:${{ github.sha }}

    - name: Scan image for vulnerabilities with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: notas:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Test if image starts correctly
      run: |
        echo "Starting container..."
        docker run -d --name test-container \
          -e SECRET_KEY=test-secret-key \
          -e DEBUG=False \
          -e ALLOWED_HOSTS=localhost \
          -e DATABASE_URL=sqlite:///tmp/db.sqlite3 \
          notas:${{ github.sha }}
        
        echo "Waiting for container to be healthy..."
        sleep 10
        
        echo "Checking if container is running..."
        docker ps -a
        
        CONTAINER_STATUS=$(docker inspect test-container --format='{{.State.Status}}')
        echo "Container status: $CONTAINER_STATUS"
        
        if [ "$CONTAINER_STATUS" != "running" ]; then
          echo "Container failed to start!"
          docker logs test-container
          exit 1
        fi
        
        echo "Container started successfully!"
        docker logs test-container
        
    - name: Cleanup test container
      if: always()
      run: |
        docker stop test-container || true
        docker rm test-container || true

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install safety
      run: pip install safety

    - name: Check dependencies for vulnerabilities
      run: safety check --file requirements.txt --continue-on-error
